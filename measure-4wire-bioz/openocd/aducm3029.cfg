# Minimal target script for the ADuCM3029 (Cortex-M3) over SWD via a
# CMSIS-DAP probe (DAPLink, in this case).
#
# There's no upstream OpenOCD flash driver for the ADuCM3029's flash
# controller (only for the unrelated ADuCM360), so this deliberately
# declares no `flash bank` -- it's for debugging/inspection (halt, read
# memory and registers, single-step) against code already programmed via
# DAPLink's drag-and-drop MSD interface, not for flashing.

source [find interface/cmsis-dap.cfg]
transport select swd

set _CHIPNAME aducm3029

swd newdap $_CHIPNAME cpu -expected-id 0x2ba01477 -ignore-version
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_m -endian little -dap $_CHIPNAME.dap

$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x1000 -work-area-backup 0

adapter speed 1000
